[package]
name = "tobj"
version = "4.0.3"
edition = "2021"
authors = [
    "Will Usher <will@willusher.io>",
    "Moritz Moeller <virtualritz@protonmail.com>",
]
description = "A lightweight OBJ loader in the spirit of tinyobjloader"
homepage = "https://github.com/Twinklebear/tobj"
documentation = "https://docs.rs/tobj/"
repository = "https://github.com/Twinklebear/tobj"
readme = "README.md"
categories = ["graphics", "games", "visualization", "rendering::data-formats"]
keywords = ["3d", "obj", "wavefront", "graphics", "parser"]
license = "MIT"

exclude = ["*.obj", "*.mtl", ".travis.yml", "fuzz/*"]

[features]
default = []
merging = []
reordering = []
async = []
arbitrary = ["arbitrary/derive"]
futures = ["dep:futures-lite", "async"]
tokio = ["dep:tokio", "async"]
use_f64 = []

[dependencies]
arbitrary = { version = "1.4", optional = true }
ahash = { version = "0.8", optional = true }
futures-lite = { version = "2.6", optional = true }
log = { version = "0.4", optional = true }
tokio = { version = "1", optional = true, features = ["io-util", "fs"] }

[dev-dependencies]
tokio-test = "0.4"
float_eq = "1"

[package.metadata.docs.rs]
features = [
    "log",
    "merging",
    "reordering",
    "async",
    "futures",
    "tokio",
    "use_f64",
]
